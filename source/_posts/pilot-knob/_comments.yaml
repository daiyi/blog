    Draught Survey (https://eurogal-surveys.ru/) — это процедура определения погружения корпуса для вычисления массы находящегося на борту груза. 
Данный подход основан на закон Архимеда и позволяет расчёта объёма груза по изменению осадки. 
Операция осуществляется до и после погрузки или разгрузки, чтобы установить реальное вес транспортируемого товара. 
Сам процесс состоит из снятия значений осадки в различных местах и проведения корректировок на плотность воды. 
Эта методика широко востребован в судоходстве для финансовых сверок и проверок. 
Данная процедура считается надёжным инструментом проверки веса груза, признанным глобальными конвенциями.
  