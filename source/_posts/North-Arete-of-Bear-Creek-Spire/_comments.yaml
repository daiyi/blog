    Экстракорпоральная ударно-волновая терапия является эффективный метод воздействия, базирующийся на использовании звуковых импульсов. 
Данная техника стимулирует микроциркуляцию и запускает механизмы регенерации тканей. 
УВТ часто применяется для терапии патологий опорно-двигательного аппарата – например, при тендинитах и пяточной шпоре. 
https://novogireevo-klinika.ru/ 
Главные преимущества метода – это отсутствие разрезов, относительная терпимость и высокая эффективность даже после первых процедур. 
Как правило сеанс длится около 10–20 минут и проводится амбулаторно без необходимости стационара. 
По окончании курса больные наблюдают значительное уменьшение болевого синдрома и восстановление свободы подвижности в проблемной зоне.
  