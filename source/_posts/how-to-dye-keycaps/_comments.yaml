 Файл в формате APK  является ZIP-архив , который  содержит все необходимые ресурсы , такие как  графика, аудио, и  конфигурационные данные. 
 Android-приложения  запускаются на устройствах с операционной системой Android , обеспечивая гибкость  для пользователей . 
 Поддержка зависит от версии процессора : файлы ARMv8  работают  только на соответствующих устройствах . 
