    Цифровая печать — наиболее распространённый вид коммерческой полиграфии. 
Широкоформатная полиграфия идеально предназначена для быстрых заказов и индивидуализации. 
Шелкография часто применяется для нанесения на текстиль и нестандартные материалы. 
https://app.readthedocs.org/profiles/printinghouse3z/ 
Флексография используется преимущественно для упаковки и изготовления этикеток. 
При наружной агитации часто используют широкоформатную печать на постерах. 
Отделочная обработка содержит такие операции, как биговка, высечка и фальцовка.
  