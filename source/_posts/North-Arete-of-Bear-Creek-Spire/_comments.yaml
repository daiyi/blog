    Выбор психолога — серьёзный шаг на пути к улучшению эмоционального здоровья. 
Для начала стоит определить свои задачи и пожелания от консультации с профессионалом. 
Хорошо оценить подготовку и стаж психолога. 
Комментарии прошлых клиентов могут поспособствовать сделать оценку более обоснованным. 
https://johnathanrxcg07417.amoblog.com/%D0%92%D1%80%D0%B0%D1%87-%D0%B4%D0%B5%D1%82%D1%81%D0%BA%D0%B8%D0%B9-%D0%BF%D1%81%D0%B8%D1%85%D0%B8%D0%B0%D1%82%D1%80-%D0%9C%D0%BE%D1%81%D0%BA%D0%B2%D1%8B-%D0%A6%D0%B5%D0%BD%D1%82%D1%80-%D0%BC%D0%B5%D0%BD%D1%82%D0%B0%D0%BB%D1%8C%D0%BD%D0%BE%D0%B3%D0%BE-%D0%B7%D0%B4%D0%BE%D1%80%D0%BE%D0%B2%D1%8C%D1%8F-%D0%AD%D0%BC%D0%BF%D0%B0%D1%82%D0%B8%D1%8F-58755243 
Также нужно проверить техники, которыми оперирует консультант. 
Первая встреча помогает оценить, насколько вам комфортно общения. 
Важно осознавать цену и режим приёма (например, очно). 
Осознанный выбор специалиста поможет ускорить движение к целям.
  